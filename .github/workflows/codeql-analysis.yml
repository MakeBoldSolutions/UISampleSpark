name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/codeql-analysis.yml'
      - '.github/codeql/codeql-config.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.cs'
      - '**.csproj'
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Initializes the CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.1
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
        config-file: .github/codeql/codeql-config.yml

    # Autobuild attempts to build C# project
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4.39.1

    # Manual build alternative (uncomment if autobuild fails)
    # - name: Manual Build
    #   run: |
    #     dotnet restore
    #     dotnet build --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.1
      with:
        category: "/language:${{matrix.language}}"
        upload: false
        output: sarif-results

    # paths-ignore in codeql-config.yml has no effect for compiled languages, so
    # CodeQL still reports on Razor source-generator output under obj/. Drop
    # those results before upload; authored code is unaffected.
    - name: Filter generated code from results
      uses: advanced-security/filter-sarif@v1.1
      with:
        patterns: |
          +**/*
          -**/obj/**
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@v4.39.1
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{matrix.language}}"

    - name: Generate analysis summary
      if: always()
      run: |
        echo "## CodeQL Analysis Complete 🔍" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Language**: C#" >> $GITHUB_STEP_SUMMARY
        echo "- **Analysis Type**: security-and-quality" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View results in the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY

# Dependabot configuration for automatic dependency updates
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    reviewers:
      - "markhazleton"
    groups:
      github-actions:
        patterns:
          - "*"

  # NuGet dependencies for all projects, in one entry so groups span projects.
  # (Separate per-directory entries split matching bumps, e.g. SkiaSharp vs its
  # native assets, or MSTest across both test projects, into failing PRs.)
  - package-ecosystem: "nuget"
    directories:
      - "/UISampleSpark.UI"
      - "/UISampleSpark.Core"
      - "/UISampleSpark.CLI"
      - "/UISampleSpark.Core.Tests"
      - "/UISampleSpark.UI.Tests"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    ignore:
      # Ignore major version updates for Microsoft packages to avoid breaking changes.
      # This also covers Microsoft.OpenApi: ASP.NET Core 10 requires 2.x; revisit with a framework upgrade.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
    groups:
      # Packages that must move in lockstep, at every update type (incl. major).
      # The first matching group wins, so these are listed before the catch-all.
      skiasharp:
        patterns:
          - "SkiaSharp*"
      mstest:
        patterns:
          - "MSTest*"
      # Everything else: one PR per week for minor and patch updates.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/UISampleSpark.UI"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # datatables.net and datatables.net-bs5 always release together.
      datatables:
        patterns:
          - "datatables.net*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base image updates
  - package-ecosystem: "docker"
    directory: "/UISampleSpark.UI"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
